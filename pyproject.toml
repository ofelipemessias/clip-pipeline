[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-pipeline"
version = "0.1.0"
description = "Corta os melhores momentos de um video em clipes verticais (9:16) com legenda, usando transcricao local e IA."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clip-pipeline = "clip_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
