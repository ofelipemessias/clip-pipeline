name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instala dependencias
        run: pip install -e ".[dev]"
      - name: Roda os testes
        run: pytest -q
